spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/campusflow}
spring.datasource.username=${DB_USERNAME:campusflow}
spring.datasource.password=${DB_PASSWORD:campusflow_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 replacement since we want to run tests against our actual PostgreSQL dialect
spring.test.database.replace=none
