spring.application.name=CampusFlow

# Database Connection
# We use defaults here so local development works without setting env vars manually.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/${DB_NAME:campusflow}}
spring.datasource.username=${DB_USERNAME:campusflow}
spring.datasource.password=${DB_PASSWORD:campusflow_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' automatically updates the schema when entity classes change. (Good for dev, bad for prod).
spring.jpa.hibernate.ddl-auto=update
# Print SQL to console so we can see what Hibernate is doing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.campusflow=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n

# Security Settings
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}