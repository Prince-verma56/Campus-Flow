<!-- Reusable Thymeleaf UI Components -->

<!-- Stat Card Component -->
<th:block th:fragment="stat-card(label, value, trend)">
    <div class="bg-campus-surface rounded-3xl p-7 shadow-neo-raised hover:shadow-neo-hover transition-all duration-300 flex flex-col justify-between h-full">
        <p class="text-xs font-bold text-ink-500 uppercase tracking-widest mb-4 opacity-80" th:text="${label}">Label</p>
        <div class="flex items-end justify-between">
            <p class="text-5xl font-extrabold text-ink-900 tracking-tighter" th:text="${value}">0</p>
            <span class="text-xs font-extrabold text-campus-accent px-3 py-1.5 rounded-xl shadow-neo-inset bg-campus-surface-active" th:text="${trend}">+0%</span>
        </div>
    </div>
</th:block>

<!-- Basic Card Component -->
<th:block th:fragment="card(title, content)">
    <div class="bg-campus-surface rounded-3xl p-7 shadow-neo-raised h-full flex flex-col">
        <h3 class="text-lg font-extrabold text-ink-900 mb-6 tracking-tight flex items-center justify-between">
            <span th:text="${title}">Card Title</span>
            <!-- Decorative recessed dot -->
            <span class="w-3 h-3 rounded-full shadow-neo-inset bg-campus-surface"></span>
        </h3>
        <!-- The tag below allows us to inject child content into the fragment when we call it! -->
        <div class="text-ink-500 leading-relaxed text-sm flex-1">
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>
</th:block>

<!-- Badge Component -->
<th:block th:fragment="badge(text, type)">
    <span th:classappend="${type == 'success' ? 'text-campus-success' : (type == 'warning' ? 'text-campus-warning' : 'text-ink-500')}" 
          class="px-3 py-1.5 text-[11px] uppercase tracking-wider font-extrabold rounded-xl shadow-neo-inset bg-campus-surface">
        <span th:text="${text}">Badge</span>
    </span>
</th:block>
