<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'CampusFlow - ' + ${title}">CampusFlow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-campus-bg min-h-screen flex flex-col antialiased text-ink-900 selection:bg-indigo-100 selection:text-indigo-900">
    
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="flex flex-1 overflow-hidden">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <main class="flex-1 overflow-y-auto p-8 lg:p-12">
            <!-- Using the updated header fragment with subtitle -->
            <div th:replace="~{fragments/page-header :: header(title=${title}, subtitle='Overview of your academic progress for the current semester.')}"></div>
            
            <!-- Statistics Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div th:replace="~{fragments/components :: stat-card(label='Current GPA', value='3.84', trend='+0.05')}"></div>
                <div th:replace="~{fragments/components :: stat-card(label='Attendance', value='96%', trend='Stable')}"></div>
                <div th:replace="~{fragments/components :: stat-card(label='Assignments Due', value='4', trend='This week')}"></div>
            </div>
            
            <!-- Main Content Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-2 flex flex-col gap-8">
                    <!-- Schedule Card -->
                    <div class="bg-campus-surface rounded-3xl p-7 shadow-neo-raised h-full flex flex-col">
                        <h3 class="text-lg font-extrabold text-ink-900 mb-6 tracking-tight flex items-center justify-between">
                            <span>Schedule</span>
                            <span class="w-3 h-3 rounded-full shadow-neo-inset bg-campus-surface"></span>
                        </h3>
                        <div class="text-ink-500 leading-relaxed text-sm flex-1">
                            <div class="flex flex-col gap-5">
                                <!-- Raised Row -->
                                <div class="flex items-center gap-5 p-5 rounded-2xl bg-campus-surface shadow-neo-surface hover:shadow-neo-raised transition-all">
                                    <!-- Recessed Time Block -->
                                    <div class="w-16 h-16 rounded-xl bg-campus-surface shadow-neo-inset border-2 border-white/30 flex flex-col items-center justify-center text-campus-accent">
                                        <span class="text-[11px] font-extrabold uppercase leading-none opacity-80">AM</span>
                                        <span class="text-2xl font-black leading-none mt-1">10</span>
                                    </div>
                                    <div class="flex-1">
                                        <h4 class="font-extrabold text-ink-900 text-base">CS301: Data Structures</h4>
                                        <p class="text-[13px] text-ink-500 mt-1 flex items-center gap-2 font-semibold">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-70"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                            Room 402, Science Wing
                                        </p>
                                    </div>
                                    <div class="ml-auto">
                                        <div th:replace="~{fragments/components :: badge(text='In 45 mins', type='warning')}"></div>
                                    </div>
                                </div>
                                
                                <!-- Inactive Row (Level 1 Surface) -->
                                <button class="w-full text-left flex items-center gap-5 p-5 rounded-2xl bg-campus-surface border-2 border-white/20 hover:shadow-neo-surface transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-campus-accent/50 focus:ring-offset-2 focus:ring-offset-campus-surface group">
                                    <div class="w-16 h-16 rounded-xl bg-campus-surface border-2 border-white/50 flex flex-col items-center justify-center text-ink-500 opacity-60 group-hover:opacity-80 transition-opacity">
                                        <span class="text-[11px] font-extrabold uppercase leading-none">PM</span>
                                        <span class="text-2xl font-black leading-none mt-1">02</span>
                                    </div>
                                    <div class="flex-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                        <h4 class="font-extrabold text-ink-900 text-base">ENG205: Modern Literature</h4>
                                        <p class="text-[13px] text-ink-500 mt-1 flex items-center gap-2 font-semibold">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-70"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                            Virtual Lecture
                                        </p>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col gap-8">
                    <!-- Recent Activity Card -->
                    <div class="bg-campus-surface rounded-3xl p-7 shadow-neo-raised h-full flex flex-col">
                        <h3 class="text-lg font-extrabold text-ink-900 mb-6 tracking-tight flex items-center justify-between">
                            <span>Recent Activity</span>
                            <span class="w-3 h-3 rounded-full shadow-neo-inset bg-campus-surface"></span>
                        </h3>
                        <div class="text-ink-500 leading-relaxed text-sm flex-1">
                            <!-- Recessed Timeline Track -->
                            <div class="relative pl-6 border-l-[3px] border-campus-surface shadow-[-1px_0_2px_rgba(163,177,198,0.3)] flex flex-col gap-8 py-2">
                                <div class="relative">
                                    <!-- Raised Marker -->
                                    <div class="absolute -left-[31px] top-0 w-4 h-4 rounded-full bg-campus-surface shadow-neo-control border-2 border-campus-success"></div>
                                    <p class="text-[15px] font-extrabold text-ink-900">Grade Posted</p>
                                    <p class="text-[13px] text-ink-500 mt-1 font-semibold">You received an <span class="font-black text-campus-success">A</span> in CS201 Midterm.</p>
                                    <p class="text-[11px] text-ink-500 mt-2 font-bold uppercase tracking-wider opacity-70">2 hours ago</p>
                                </div>
                                <div class="relative">
                                    <!-- Raised Marker -->
                                    <div class="absolute -left-[31px] top-0 w-4 h-4 rounded-full bg-campus-surface shadow-neo-control border-2 border-campus-accent"></div>
                                    <p class="text-[15px] font-extrabold text-ink-900">Assignment Uploaded</p>
                                    <p class="text-[13px] text-ink-500 mt-1 font-semibold">"Algorithm Analysis" was submitted successfully.</p>
                                    <p class="text-[11px] text-ink-500 mt-2 font-bold uppercase tracking-wider opacity-70">Yesterday at 4:30 PM</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </main>
    </div>
    
</body>
</html>
