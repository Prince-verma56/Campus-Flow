<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'CampusFlow - ' + ${title}">CampusFlow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-campus-bg min-h-screen flex flex-col antialiased">
    <!-- Fragment injection! Notice how we use th:replace to insert our reusable parts -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="flex flex-1 overflow-hidden relative">
        <!-- Subtle Neumorphic Background Elements -->
        <div class="absolute top-10 left-10 w-64 h-64 rounded-full shadow-neo-surface bg-campus-surface hidden lg:block"></div>
        <div class="absolute bottom-10 right-10 w-96 h-96 rounded-full shadow-neo-inset bg-campus-surface hidden lg:block"></div>

        <main class="flex-1 overflow-y-auto p-12 flex flex-col items-center justify-center text-center relative z-10">
            <div class="bg-campus-surface p-16 rounded-[3rem] shadow-neo-raised max-w-4xl w-full border border-white/40">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-campus-surface shadow-neo-inset mb-8 text-sm font-extrabold text-campus-accent tracking-widest uppercase">
                    <span class="w-2 h-2 rounded-full bg-campus-accent animate-pulse"></span>
                    CampusFlow 2.0
                </div>
                <h1 class="text-6xl md:text-7xl font-black text-ink-900 mb-8 tracking-tighter leading-tight">
                    Let's Make Education <br/> Better <span class="text-campus-accent">Together</span>
                </h1>
                <p class="text-xl md:text-2xl text-ink-500 mb-12 max-w-2xl mx-auto leading-relaxed font-medium">
                    Manage academics, track progress, and stay connected — all in one intelligent, tactile platform.
                </p>
                <a href="/dashboard" class="inline-flex items-center justify-center px-10 py-5 bg-campus-surface text-campus-accent rounded-2xl font-black transition-all shadow-neo-control hover:shadow-neo-pressed text-lg border border-white/50 group">
                    Enter Dashboard 
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ml-3 group-hover:translate-x-1 transition-transform"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </a>
            </div>
        </main>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
