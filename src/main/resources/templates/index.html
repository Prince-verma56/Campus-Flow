<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'CampusFlow - ' + ${title}">CampusFlow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">
    <!-- Fragment injection! Notice how we use th:replace to insert our reusable parts -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 overflow-y-auto p-12 flex flex-col items-center justify-center text-center">
            <h1 class="text-6xl font-extrabold text-gray-900 mb-6 tracking-tight">
                Let's Make Education <br/> Better <span class="text-indigo-600">Together</span>
            </h1>
            <p class="text-xl text-gray-600 mb-10 max-w-2xl leading-relaxed">
                Manage academics, track progress, and stay connected — all in one intelligent platform.
            </p>
            <a href="/dashboard" class="px-8 py-4 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-all shadow-md hover:shadow-lg text-lg">
                Enter Dashboard &rarr;
            </a>
        </main>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
