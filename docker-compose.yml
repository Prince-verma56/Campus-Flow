version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campusflow}
      POSTGRES_USER: ${DB_USERNAME:-campusflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campusflow_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
